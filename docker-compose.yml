version: '3.8'

services:
  # Fraud Detection API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    volumes:
      # Mount model files
      - ./models:/app/models
      # Mount logs
      - ./logs:/app/logs
      # Mount data for drift detection
      - ./paysim_features.csv:/app/paysim_features.csv:ro
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MODEL_VERSION=1.0.0
      - ENABLE_MONITORING=true
      - LOG_LEVEL=INFO
      # Email Alert Configuration
      - ALERT_ENABLED=${ALERT_ENABLED}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_PASSWORD=${SENDER_PASSWORD}
      - RECIPIENT_EMAIL=${RECIPIENT_EMAIL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mlops-network

  # Monitoring Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs:ro
      - ./models:/app/models:ro
    command: ["streamlit", "run", "monitoring/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge

volumes:
  models:
  logs:
